name: Lint

on: [push, pull_request]

# Cancel superseded runs on the same ref instead of queueing them up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.dev.txt

      - name: Install dependencies
        run: pip install -r requirements.dev.txt -r requirements.txt

      - name: Isort
        run: make isort-check

      - name: Black
        run: make black-check

      - name: Pylint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.dev.txt

      - name: Install dependencies
        # The ml-onnx / ml-openvino extras are not installed: the tests that need
        # them download a model from the Hugging Face hub, so they self-skip here.
        run: pip install -r requirements.dev.txt -e .

      - name: Pytest
        run: make test
